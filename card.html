<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کارت سرویس خودرو</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0c0e12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<div class="topbar">
  <div class="brand" id="shopNameLabel">کارت سرویس خودرو</div>
</div>

<div class="wrap">
  <div id="installBanner" class="qr-hint" style="display:none;justify-content:space-between;align-items:center;">
    <span id="installText">این کارت رو به صفحه اصلی گوشی‌تون اضافه کنید تا همیشه در دسترس باشه.</span>
    <button class="toggle-btn" id="installBtn" style="white-space:nowrap;">افزودن</button>
  </div>
  <div id="content">
    <div class="empty-state">در حال بارگذاری...</div>
  </div>
</div>

<script type="module">
  import { db } from "./firebase-config.js";
  import {
    doc, getDoc, collection, query, where, orderBy, getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const params = new URLSearchParams(window.location.search);
  const cardId = params.get("id");
  const shopId = params.get("shop");
  const content = document.getElementById("content");

  function renderServicesHtml(servicesSnap) {
    let servicesHtml = `<div class="empty-state">هنوز سرویسی برای این خودرو ثبت نشده است.</div>`;
    if (!servicesSnap.empty) {
      servicesHtml = `<div class="card">`;
      servicesSnap.forEach((docSnap) => {
        const s = docSnap.data();
        const dateStr = s.date && s.date.toDate ? s.date.toDate().toLocaleDateString("fa-IR") : "";
        const filters = [];
        if (s.cabinFilter) filters.push("فیلتر کابین");
        if (s.airFilter) filters.push("فیلتر هوا");
        if (s.fuelFilter) filters.push("صافی بنزین");
        if (s.oilFilter) filters.push("فیلتر روغن");
        const filtersStr = filters.length ? filters.join("، ") : "بدون تعویض فیلتر";
        servicesHtml += `
          <div class="service-row">
            <div>
              <div class="service-type">${s.oilType || "(بدون نوع روغن)"}</div>
              <div class="service-meta">${dateStr} &middot; کیلومتر ${s.mileage ?? "-"}</div>
              <div class="service-meta">${filtersStr}${s.notes ? " &middot; " + s.notes : ""}</div>
            </div>
            <div class="service-meta">سرویس بعدی: ${s.nextDueKm ?? "-"} کیلومتر</div>
          </div>
        `;
      });
      servicesHtml += `</div>`;
    }
    return servicesHtml;
  }

  async function showCardHistory(shopIdVal, cardIdVal, plateNumber, backToSearch) {
    const q = query(
      collection(db, "shops", shopIdVal, "services"),
      where("cardId", "==", cardIdVal),
      orderBy("date", "desc")
    );
    const servicesSnap = await getDocs(q);

    content.innerHTML = `
      ${backToSearch ? `<button class="toggle-btn" id="backToSearchBtn" style="margin-bottom:16px;">&rarr; جست‌وجوی خودروی دیگر</button>` : ""}
      <div class="plate" style="margin-bottom:20px;">${plateNumber || ""}</div>
      <div class="section-title" style="margin-top:0;">سوابق سرویس</div>
      ${renderServicesHtml(servicesSnap)}
    `;

    if (backToSearch) {
      document.getElementById("backToSearchBtn").addEventListener("click", () => showPlateSearch(shopIdVal));
    }
  }

  function showPlateSearch(shopIdVal, notFoundMsg) {
    content.innerHTML = `
      <div class="card">
        <p style="font-size:14px;color:var(--steel);margin:0 0 14px;">شماره پلاک خودروی خود را وارد کنید تا سوابق سرویس آن را ببینید.</p>
        ${notFoundMsg ? `<div class="error-msg" style="display:block;">${notFoundMsg}</div>` : ""}
        <input type="text" id="plateSearchInput" placeholder="مثلاً ۱۲ ایران ۳۴۵ ب ۶۷">
        <button class="primary" id="plateSearchBtn">جست‌وجو</button>
      </div>
    `;

    document.getElementById("plateSearchBtn").addEventListener("click", async () => {
      const term = document.getElementById("plateSearchInput").value.trim();
      if (!term) return;

      const q = query(collection(db, "cards"), where("shopId", "==", shopIdVal));
      const snap = await getDocs(q);
      const matches = [];
      snap.forEach((docSnap) => {
        const c = docSnap.data();
        if ((c.plateNumber || "").includes(term)) matches.push({ id: docSnap.id, ...c });
      });

      if (matches.length === 0) {
        showPlateSearch(shopIdVal, "خودرویی با این شماره پلاک پیدا نشد.");
      } else if (matches.length === 1) {
        showCardHistory(shopIdVal, matches[0].id, matches[0].plateNumber, true);
      } else {
        content.innerHTML = `
          <div class="section-title" style="margin-top:0;">چند خودرو پیدا شد — یکی را انتخاب کنید</div>
          <div id="matchList"></div>
        `;
        const list = document.getElementById("matchList");
        matches.forEach((m) => {
          const row = document.createElement("div");
          row.className = "shop-row";
          row.style.cursor = "pointer";
          row.innerHTML = `<div class="name">${m.plateNumber}</div>`;
          row.addEventListener("click", () => showCardHistory(shopIdVal, m.id, m.plateNumber, true));
          list.appendChild(row);
        });
      }
    });
  }

  async function loadCard() {
    // حالت جدید: QR ثابت مغازه (جست‌وجو بر اساس پلاک)
    if (shopId) {
      const shopSnap = await getDoc(doc(db, "shops", shopId));
      const shopData = shopSnap.exists() ? shopSnap.data() : {};
      document.getElementById("shopNameLabel").textContent = shopData.name || "کارت سرویس خودرو";
      showPlateSearch(shopId);
      return;
    }

    // حالت قدیمی: لینک مستقیم به یک کارت خاص (سازگاری با نسخه‌ی قبلی)
    if (!cardId) {
      content.innerHTML = `<div class="empty-state">کد کارت نامعتبر است.</div>`;
      return;
    }

    const cardSnap = await getDoc(doc(db, "cards", cardId));
    if (!cardSnap.exists()) {
      content.innerHTML = `<div class="empty-state">این کارت یافت نشد.</div>`;
      return;
    }
    const cardData = cardSnap.data();

    const shopSnap = await getDoc(doc(db, "shops", cardData.shopId));
    const shopData = shopSnap.exists() ? shopSnap.data() : {};
    document.getElementById("shopNameLabel").textContent = shopData.name || "کارت سرویس خودرو";

    showCardHistory(cardData.shopId, cardId, cardData.plateNumber, false);
  }

  loadCard();

  // --- ثبت سرویس‌ورکر برای قابلیت نصب روی صفحه اصلی ---
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  const isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  const installBanner = document.getElementById("installBanner");
  const installBtn = document.getElementById("installBtn");
  const installText = document.getElementById("installText");

  const isIOS = /iphone|ipad|ipod/i.test(window.navigator.userAgent);

  let deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (!isStandalone) installBanner.style.display = "flex";
  });

  installBtn.addEventListener("click", async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBanner.style.display = "none";
    }
  });

  if (isIOS && !isStandalone) {
    installText.textContent = "برای ذخیره‌ی همیشگی: روی دکمه‌ی Share زیر صفحه بزنید و «Add to Home Screen» را انتخاب کنید.";
    installBtn.style.display = "none";
    installBanner.style.display = "flex";
  }
</script>

</body>
</html>
