<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مغازه | کارت دیجیتال سرویس خودرو</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="brand" id="shopNameLabel">پنل مغازه</div>
  <button id="logoutBtn">خروج</button>
</div>

<div class="wrap">

  <!-- نمای لیست کارت‌های مشتری -->
  <div id="listView">

    <div class="section-title" style="margin-top:0;">QR ثابت مغازه (برای چاپ و نصب روی شیشه)</div>
    <div class="card" style="margin-bottom:24px;">
      <p style="font-size:13px;color:var(--steel);margin:0 0 12px;">
        این یک QR ثابت است. فقط یک‌بار چاپ کنید و روی شیشه‌ی مغازه بچسبانید — همه‌ی مشتری‌ها از همین یکی استفاده می‌کنند.
      </p>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <img id="shopQrImg" width="130" height="130" style="border-radius:8px;border:1px solid var(--line);">
        <a id="shopQrLink" target="_blank" style="font-size:13px;word-break:break-all;color:var(--steel);"></a>
      </div>
      <a id="shopRouteLink" target="_blank" class="toggle-btn" style="display:none;margin-top:14px;text-decoration:none;">مسیریاب آدرس مغازه (برای ارسال به مشتری)</a>
    </div>

    <div class="section-title">کارت‌های مشتری</div>
    <div id="cardsList"></div>

    <div class="section-title">افزودن مشتری جدید</div>
    <div class="add-form">
      <div class="error-msg" id="cardFormError"></div>
      <label for="plateNumber">شماره پلاک یا نام مشتری</label>
      <input type="text" id="plateNumber" autocomplete="off" placeholder="مثلاً ۱۲ ایران ۳۴۵ ب ۶۷">
      <button class="primary" id="addCardBtn" style="width:auto;padding:11px 26px;">ساخت کارت جدید</button>
    </div>
  </div>

  <!-- نمای جزئیات یک کارت مشتری -->
  <div id="detailView" style="display:none;">
    <button class="toggle-btn" id="backBtn" style="margin-bottom:18px;">&rarr; بازگشت به لیست</button>

    <div class="card" style="margin-bottom:20px;">
      <div class="plate" id="platePill"></div>
    </div>

    <div class="section-title">سوابق سرویس</div>
    <div class="card" id="servicesList"></div>

    <div class="section-title">ثبت سرویس جدید</div>
    <div class="add-form">
      <div class="error-msg" id="serviceFormError"></div>
      <div class="grid">
        <div>
          <label for="oilType">نوع روغن</label>
          <input type="text" id="oilType" autocomplete="off" placeholder="مثلاً پارس روغن">
        </div>
        <div>
          <label for="mileage">کیلومتر فعلی</label>
          <input type="number" id="mileage" autocomplete="off" placeholder="45000">
        </div>
      </div>
      <div class="grid">
        <div>
          <label for="nextDueKm">کیلومتر سرویس بعدی</label>
          <input type="number" id="nextDueKm" autocomplete="off" placeholder="50000">
        </div>
        <div></div>
      </div>
      <label style="margin-bottom:8px;">موارد انجام‌شده</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-bottom:16px;">
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);"><input type="checkbox" id="cabinFilter" style="width:auto;margin:0;"> فیلتر کابین</label>
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);"><input type="checkbox" id="airFilter" style="width:auto;margin:0;"> فیلتر هوا</label>
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);"><input type="checkbox" id="fuelFilter" style="width:auto;margin:0;"> صافی بنزین</label>
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);"><input type="checkbox" id="oilFilter" style="width:auto;margin:0;"> تعویض فیلتر روغن</label>
      </div>
      <label for="serviceNotes">توضیحات (اختیاری)</label>
      <textarea id="serviceNotes" rows="2" autocomplete="off" placeholder="یادداشت آزاد درباره‌ی این سرویس..." style="width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;margin-bottom:16px;background:var(--paper);color:var(--ink);resize:vertical;"></textarea>
      <button class="primary" id="addServiceBtn" style="width:auto;padding:11px 26px;">ثبت سرویس</button>
    </div>
  </div>

</div>

<script type="module">
  import { auth, db } from "./firebase-config.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    doc, getDoc, collection, addDoc, getDocs, query, where, orderBy, serverTimestamp,
    updateDoc, deleteDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const shopId = localStorage.getItem("shopId");
  if (!shopId) window.location.href = "login.html";

  let shopData = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "login.html"; return; }
    const shopSnap = await getDoc(doc(db, "shops", shopId));
    if (!shopSnap.exists()) { window.location.href = "login.html"; return; }
    shopData = shopSnap.data();
    if (shopData.isActive === false) {
      document.body.innerHTML = `<div class="center-screen"><div class="card" style="text-align:center;"><p style="margin:0;">دسترسی این مغازه غیرفعال شده است.<br>لطفاً با مدیریت تماس بگیرید.</p></div></div>`;
      return;
    }
    document.getElementById("shopNameLabel").textContent = shopData.name || "پنل مغازه";

    const shopUrl = `${window.location.origin}${window.location.pathname.replace("shop.html", "card.html")}?shop=${shopId}`;
    document.getElementById("shopQrLink").href = shopUrl;
    document.getElementById("shopQrLink").textContent = shopUrl;
    document.getElementById("shopQrImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=${encodeURIComponent(shopUrl)}`;

    if (shopData.address) {
      const routeLink = document.getElementById("shopRouteLink");
      routeLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(shopData.address)}`;
      routeLink.style.display = "inline-block";
    }

    loadCards();
  });

  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("shopId");
    signOut(auth).then(() => window.location.href = "login.html");
  });

  const listView = document.getElementById("listView");
  const detailView = document.getElementById("detailView");
  const cardsList = document.getElementById("cardsList");

  async function loadCards() {
    cardsList.innerHTML = "";
    const q = query(collection(db, "cards"), where("shopId", "==", shopId));
    const snap = await getDocs(q);

    if (snap.empty) {
      cardsList.innerHTML = `<div class="empty-state">هنوز هیچ کارت مشتری‌ای ساخته نشده است.</div>`;
      return;
    }

    snap.forEach((docSnap) => {
      const c = docSnap.data();
      const row = document.createElement("div");
      row.className = "shop-row";
      row.style.cursor = "pointer";
      row.innerHTML = `
        <div class="name">${c.plateNumber || "(بدون شماره)"}</div>
        <div class="row-actions"><span class="badge active">مشاهده</span></div>
      `;
      row.addEventListener("click", () => openCard(docSnap.id, c));
      cardsList.appendChild(row);
    });
  }

  document.getElementById("addCardBtn").addEventListener("click", async () => {
    const errBox = document.getElementById("cardFormError");
    errBox.style.display = "none";
    const plateNumber = document.getElementById("plateNumber").value.trim();
    if (!plateNumber) {
      errBox.textContent = "لطفاً شماره پلاک یا نام مشتری را وارد کنید.";
      errBox.style.display = "block";
      return;
    }
    await addDoc(collection(db, "cards"), {
      shopId, plateNumber, createdAt: serverTimestamp(),
    });
    document.getElementById("plateNumber").value = "";
    loadCards();
  });

  // --- نمای جزئیات کارت ---
  let currentCardId = null;

  function openCard(cardId, cardData) {
    currentCardId = cardId;
    listView.style.display = "none";
    detailView.style.display = "block";
    document.getElementById("platePill").textContent = cardData.plateNumber;
    loadServices(cardId);
  }

  document.getElementById("backBtn").addEventListener("click", () => {
    detailView.style.display = "none";
    listView.style.display = "block";
    loadCards();
  });

  async function loadServices(cardId) {
    const list = document.getElementById("servicesList");
    list.innerHTML = "";
    const q = query(
      collection(db, "shops", shopId, "services"),
      where("cardId", "==", cardId),
      orderBy("date", "desc")
    );
    const snap = await getDocs(q);

    if (snap.empty) {
      list.innerHTML = `<div class="empty-state">هنوز سرویسی برای این مشتری ثبت نشده است.</div>`;
      return;
    }

    snap.forEach((docSnap) => {
      const s = docSnap.data();
      const id = docSnap.id;
      const dateStr = s.date && s.date.toDate ? s.date.toDate().toLocaleDateString("fa-IR") : "";
      const filters = [];
      if (s.cabinFilter) filters.push("فیلتر کابین");
      if (s.airFilter) filters.push("فیلتر هوا");
      if (s.fuelFilter) filters.push("صافی بنزین");
      if (s.oilFilter) filters.push("فیلتر روغن");
      const filtersStr = filters.length ? filters.join("، ") : "بدون تعویض فیلتر";

      const row = document.createElement("div");
      row.className = "service-row";
      row.id = `svc-row-${id}`;
      row.innerHTML = `
        <div>
          <div class="service-type">${s.oilType || "(بدون نوع روغن)"}</div>
          <div class="service-meta">${dateStr} &middot; کیلومتر ${s.mileage ?? "-"}</div>
          <div class="service-meta">${filtersStr}${s.notes ? " &middot; " + s.notes : ""}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="service-meta">سرویس بعدی: ${s.nextDueKm ?? "-"} کیلومتر</div>
          <button class="toggle-btn svc-edit-btn" data-id="${id}" style="padding:5px 10px;font-size:12px;">ویرایش</button>
          <button class="toggle-btn svc-delete-btn" data-id="${id}" style="padding:5px 10px;font-size:12px;">حذف</button>
        </div>
      `;
      list.appendChild(row);

      const editForm = document.createElement("div");
      editForm.className = "add-form";
      editForm.id = `svc-edit-form-${id}`;
      editForm.style.display = "none";
      editForm.style.margin = "10px 0";
      editForm.innerHTML = `
        <div class="grid">
          <div>
            <label>نوع روغن</label>
            <input type="text" class="svc-edit-oiltype" value="${s.oilType || ""}">
          </div>
          <div>
            <label>کیلومتر فعلی</label>
            <input type="number" class="svc-edit-mileage" value="${s.mileage ?? ""}">
          </div>
        </div>
        <div class="grid">
          <div>
            <label>کیلومتر سرویس بعدی</label>
            <input type="number" class="svc-edit-next" value="${s.nextDueKm ?? ""}">
          </div>
          <div></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-bottom:16px;">
          <label style="display:flex;align-items:center;gap:8px;font-size:14px;"><input type="checkbox" class="svc-edit-cabin" style="width:auto;margin:0;" ${s.cabinFilter ? "checked" : ""}> فیلتر کابین</label>
          <label style="display:flex;align-items:center;gap:8px;font-size:14px;"><input type="checkbox" class="svc-edit-air" style="width:auto;margin:0;" ${s.airFilter ? "checked" : ""}> فیلتر هوا</label>
          <label style="display:flex;align-items:center;gap:8px;font-size:14px;"><input type="checkbox" class="svc-edit-fuel" style="width:auto;margin:0;" ${s.fuelFilter ? "checked" : ""}> صافی بنزین</label>
          <label style="display:flex;align-items:center;gap:8px;font-size:14px;"><input type="checkbox" class="svc-edit-oilfilter" style="width:auto;margin:0;" ${s.oilFilter ? "checked" : ""}> تعویض فیلتر روغن</label>
        </div>
        <label>توضیحات</label>
        <textarea class="svc-edit-notes" rows="2" style="width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;margin-bottom:16px;background:var(--paper);color:var(--ink);resize:vertical;">${s.notes || ""}</textarea>
        <div style="display:flex;gap:10px;">
          <button class="primary svc-save-btn" style="width:auto;padding:9px 20px;" data-id="${id}">ذخیره</button>
          <button class="toggle-btn svc-cancel-btn" data-id="${id}">انصراف</button>
        </div>
      `;
      list.appendChild(editForm);
    });

    document.querySelectorAll(".svc-edit-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const form = document.getElementById(`svc-edit-form-${btn.dataset.id}`);
        form.style.display = form.style.display === "none" ? "block" : "none";
      });
    });

    document.querySelectorAll(".svc-cancel-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.getElementById(`svc-edit-form-${btn.dataset.id}`).style.display = "none";
      });
    });

    document.querySelectorAll(".svc-save-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id;
        const form = document.getElementById(`svc-edit-form-${id}`);
        const oilType = form.querySelector(".svc-edit-oiltype").value.trim();
        const mileage = parseFloat(form.querySelector(".svc-edit-mileage").value);
        const nextDueKm = parseFloat(form.querySelector(".svc-edit-next").value);
        const notes = form.querySelector(".svc-edit-notes").value.trim();
        const cabinFilter = form.querySelector(".svc-edit-cabin").checked;
        const airFilter = form.querySelector(".svc-edit-air").checked;
        const fuelFilter = form.querySelector(".svc-edit-fuel").checked;
        const oilFilter = form.querySelector(".svc-edit-oilfilter").checked;

        await updateDoc(doc(db, "shops", shopId, "services", id), {
          oilType, mileage: mileage || null, nextDueKm: nextDueKm || null, notes,
          cabinFilter, airFilter, fuelFilter, oilFilter,
        });
        loadServices(currentCardId);
      });
    });

    document.querySelectorAll(".svc-delete-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm("این سرویس حذف شود؟")) return;
        await deleteDoc(doc(db, "shops", shopId, "services", btn.dataset.id));
        loadServices(currentCardId);
      });
    });
  }

  document.getElementById("addServiceBtn").addEventListener("click", async () => {
    const errBox = document.getElementById("serviceFormError");
    errBox.style.display = "none";

    const oilType = document.getElementById("oilType").value.trim();
    const mileage = parseFloat(document.getElementById("mileage").value);
    const nextDueKm = parseFloat(document.getElementById("nextDueKm").value);
    const notes = document.getElementById("serviceNotes").value.trim();
    const cabinFilter = document.getElementById("cabinFilter").checked;
    const airFilter = document.getElementById("airFilter").checked;
    const fuelFilter = document.getElementById("fuelFilter").checked;
    const oilFilter = document.getElementById("oilFilter").checked;

    if (!mileage) {
      errBox.textContent = "لطفاً کیلومتر فعلی را وارد کنید.";
      errBox.style.display = "block";
      return;
    }

    await addDoc(collection(db, "shops", shopId, "services"), {
      cardId: currentCardId,
      oilType, mileage, nextDueKm: nextDueKm || null, notes,
      cabinFilter, airFilter, fuelFilter, oilFilter,
      date: serverTimestamp(),
    });

    document.getElementById("oilType").value = "";
    document.getElementById("mileage").value = "";
    document.getElementById("nextDueKm").value = "";
    document.getElementById("serviceNotes").value = "";
    document.getElementById("cabinFilter").checked = false;
    document.getElementById("airFilter").checked = false;
    document.getElementById("fuelFilter").checked = false;
    document.getElementById("oilFilter").checked = false;
    loadServices(currentCardId);
  });
</script>

</body>
</html>
