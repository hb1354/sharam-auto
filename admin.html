<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | کارت دیجیتال سرویس خودرو</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">پنل مدیریت <span>&middot; هاجر سرویس</span></div>
  <button id="logoutBtn">خروج</button>
</div>

<div class="wrap">

  <div class="section-title">مغازه‌ها</div>
  <div id="shopsList"></div>

  <div class="section-title">افزودن مغازه‌ی جدید</div>
  <div class="add-form">
    <div class="error-msg" id="formError"></div>
    <div class="grid">
      <div>
        <label for="shopName">نام مغازه</label>
        <input type="text" id="shopName" placeholder="مثلاً اتوسرویس شهرام">
      </div>
      <div>
        <label for="ownerPhone">شماره موبایل صاحب مغازه</label>
        <input type="text" id="ownerPhone" placeholder="09xxxxxxxxx">
      </div>
    </div>
    <div class="grid">
      <div>
        <label for="ownerEmail">ایمیل ورود مغازه</label>
        <input type="email" id="ownerEmail" placeholder="shop1@example.com">
      </div>
      <div></div>
    </div>
    <p style="font-size:12.5px;color:var(--steel);margin:-6px 0 16px;">
      پیش از افزودن، باید یک کاربر با همین ایمیل در بخش Authentication فایربیس ساخته باشید تا مغازه بتواند با آن وارد شود.
    </p>
    <button class="primary" id="addShopBtn" style="width:auto;padding:11px 26px;">افزودن مغازه</button>
  </div>

</div>

<script type="module">
  import { auth, db } from "./firebase-config.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    collection, addDoc, getDocs, doc, updateDoc, serverTimestamp, orderBy, query
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  onAuthStateChanged(auth, (user) => {
    if (!user) window.location.href = "login.html";
  });

  document.getElementById("logoutBtn").addEventListener("click", () => {
    signOut(auth).then(() => window.location.href = "login.html");
  });

  const shopsList = document.getElementById("shopsList");

  async function loadShops() {
    shopsList.innerHTML = "";
    const q = query(collection(db, "shops"), orderBy("createdAt", "desc"));
    const snap = await getDocs(q);

    if (snap.empty) {
      shopsList.innerHTML = `<div class="empty-state">هنوز هیچ مغازه‌ای اضافه نشده است.</div>`;
      return;
    }

    snap.forEach((docSnap) => {
      const shop = docSnap.data();
      const id = docSnap.id;
      const row = document.createElement("div");
      row.className = "shop-row";
      row.id = `shop-row-${id}`;
      row.innerHTML = `
        <div>
          <div class="name">${shop.name || "(بدون نام)"}</div>
          <div class="phone">${shop.ownerPhone || ""} ${shop.ownerEmail ? " &middot; " + shop.ownerEmail : ""}</div>
        </div>
        <div class="row-actions">
          <span class="badge ${shop.isActive ? "active" : "inactive"}">${shop.isActive ? "فعال" : "غیرفعال"}</span>
          <button class="toggle-btn edit-btn" data-id="${id}">ویرایش</button>
          <button class="toggle-btn" data-id="${id}" data-active="${shop.isActive}">
            ${shop.isActive ? "غیرفعال کردن" : "فعال کردن"}
          </button>
        </div>
      `;
      shopsList.appendChild(row);

      const editForm = document.createElement("div");
      editForm.className = "add-form";
      editForm.id = `edit-form-${id}`;
      editForm.style.display = "none";
      editForm.style.marginBottom = "10px";
      editForm.innerHTML = `
        <div class="grid">
          <div>
            <label>نام مغازه</label>
            <input type="text" class="edit-name" value="${shop.name || ""}">
          </div>
          <div>
            <label>شماره موبایل صاحب مغازه</label>
            <input type="text" class="edit-phone" value="${shop.ownerPhone || ""}">
          </div>
        </div>
        <div style="display:flex;gap:10px;">
          <button class="primary save-edit-btn" style="width:auto;padding:9px 20px;" data-id="${id}">ذخیره</button>
          <button class="toggle-btn cancel-edit-btn" data-id="${id}">انصراف</button>
        </div>
      `;
      shopsList.appendChild(editForm);
    });

    document.querySelectorAll(".edit-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        const form = document.getElementById(`edit-form-${id}`);
        form.style.display = form.style.display === "none" ? "block" : "none";
      });
    });

    document.querySelectorAll(".cancel-edit-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.getElementById(`edit-form-${btn.dataset.id}`).style.display = "none";
      });
    });

    document.querySelectorAll(".save-edit-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id;
        const form = document.getElementById(`edit-form-${id}`);
        const name = form.querySelector(".edit-name").value.trim();
        const ownerPhone = form.querySelector(".edit-phone").value.trim();

        if (!name || !ownerPhone) return;

        await updateDoc(doc(db, "shops", id), { name, ownerPhone });
        loadShops();
      });
    });

    document.querySelectorAll(".toggle-btn:not(.edit-btn):not(.cancel-edit-btn)").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id;
        const current = btn.dataset.active === "true";
        await updateDoc(doc(db, "shops", id), { isActive: !current });
        loadShops();
      });
    });
  }

  document.getElementById("addShopBtn").addEventListener("click", async () => {
    const formError = document.getElementById("formError");
    formError.style.display = "none";

    const name = document.getElementById("shopName").value.trim();
    const ownerPhone = document.getElementById("ownerPhone").value.trim();
    const ownerEmail = document.getElementById("ownerEmail").value.trim();

    if (!name || !ownerPhone || !ownerEmail) {
      formError.textContent = "لطفاً همه‌ی فیلدها را پر کنید.";
      formError.style.display = "block";
      return;
    }

    await addDoc(collection(db, "shops"), {
      name, ownerPhone, ownerEmail,
      isActive: true,
      createdAt: serverTimestamp(),
    });

    document.getElementById("shopName").value = "";
    document.getElementById("ownerPhone").value = "";
    document.getElementById("ownerEmail").value = "";
    loadShops();
  });

  loadShops();
</script>

</body>
</html>
